name = "ecommerce"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Binding database D1 (dibuat saat deploy: wrangler d1 create ecommerce)
[[d1_databases]]
binding = "DB"
database_name = "ecommerce"
database_id = "cfb1092c-c3a5-47a5-8c57-5e34e007fa78"

# Menyajikan file statis (toko & admin) dari folder public/
[assets]
directory = "public"
